name = "rent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "rent"
database_name = "rent"
database_id = "00934261-93c9-4cbc-a5a6-eb1aff0c6530"

# ─── Environment Variables ────────────────────────────────────
# Non-secret config (safe to keep here)
[vars]
ENVIRONMENT = "development"
GOOGLE_REDIRECT_URI = "https://rent-jet.vercel.app/auth/google/callback"
# Comma-separated list of allowed CORS origins
# For production, set via: wrangler secret put ALLOWED_ORIGINS
ALLOWED_ORIGINS = "http://localhost:3000,https://rent-jet.vercel.app"

# ─── Secrets (NEVER commit these — set via CLI) ──────────────
# Run each of these before first deploy:
#   wrangler secret put JWT_SECRET
#   wrangler secret put RAZORPAY_KEY_ID
#   wrangler secret put RAZORPAY_KEY_SECRET
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET